name: CI
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_WEBHOOK_SECRET: "dummy_secret_for_ci_only"
      BOT_TOKEN: "123456:CI_TEST_TOKEN"
      MONGO_URI: "mongodb://127.0.0.1:27017"
      APP_ENV: "development"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install Chromium for the browser tests
        # tests/browser runs the real app in Chromium with vendored axe-core.
        run: python -m playwright install --with-deps chromium
      - name: Audit production dependencies
        # Production only. requirements-dev.txt is deliberately not
        # audited: pytest never runs on the server, and pytest-asyncio
        # pins it below the release that fixes its advisory. Blocking
        # rather than advisory, because this gate is green today and a
        # gate that starts red is one everyone learns to ignore.
        run: pip-audit --requirement requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        # main and pull requests into main: every test has to pass.
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: pytest -v
      - name: Run tests (only the known failures may fail)
        # fix/** and feat/** branches: a batch carries its failing tests on purpose until
        # they are fixed (tests/known_failures.txt). This fails on any other
        # failure, and on a known failure that started to pass, by name.
        if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/check_known_failures.py
