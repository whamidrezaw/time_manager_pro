<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ direction }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ title }}</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:url" content="{{ page_url }}" />
  <meta property="og:image" content="{{ card_url }}" />
  <meta property="og:image:width" content="1080" />
  <meta property="og:image:height" content="1080" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ card_url }}" />
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="/static/countdown.css?v={{ asset_version }}" />
</head>
<body data-miniapp-url="{{ miniapp_url }}">
  <img src="{{ card_url }}" alt="{{ title }}" />
  {% if join_url %}<a class="cta" href="{{ join_url }}">{{ join_label }}</a>
  <a class="cta cta-quiet" href="{{ miniapp_url }}">{{ open_label }}</a>
  {% else %}<a class="cta" href="{{ miniapp_url }}">{{ open_label }}</a>
  {% endif %}
  <footer>{{ made_with }} · {{ bot_handle }}</footer>

  <script src="/static/countdown.js?v={{ asset_version }}" defer></script>
</body>
</html>
